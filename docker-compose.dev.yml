  qdrant:
    image: docker.arvancloud.ir/qdrant/qdrant:latest
    ports:
      - "6010:6333"
    networks:
      - IAU-Sherlock-Net
    volumes:
      - ./qdrant_data:/qdrant/storage

volumes:
  qdrant_data:

networks:
  IAU-Sherlock-Net:
    driver: bridge